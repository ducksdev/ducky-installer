<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in · Ducky Pool</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%230c0e13'/><ellipse cx='38' cy='42' rx='20' ry='14' fill='%23f9a825'/><circle cx='22' cy='26' r='11' fill='%23f9a825'/><path d='M 6 26 L 14 22 L 14 30 Z' fill='%23ff6f00'/><circle cx='20' cy='24' r='1.6' fill='%230c0e13'/></svg>">
  <script>
  (function applyTheme() {
    try {
      var LS = 'ducky-theme:';
      var mode = localStorage.getItem(LS + 'mode') || 'dark';
      if (mode === 'auto') {
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        mode = prefersLight ? 'light' : 'dark';
      }
      if (mode === 'light' || mode === 'contrast') {
        document.documentElement.setAttribute('data-theme', mode);
      }
      var size = localStorage.getItem(LS + 'size');
      if (size && size !== 'normal') document.documentElement.setAttribute('data-text-size', size);
      var font = localStorage.getItem(LS + 'font');
      if (font && font !== 'system') document.documentElement.setAttribute('data-font', font);
      var accent = localStorage.getItem(LS + 'accent');
      if (accent && /^#?[0-9a-f]{6}$/i.test(accent)) {
        var clean = accent.replace(/^#/, '');
        document.documentElement.style.setProperty('--accent', '#' + clean);
        var r = parseInt(clean.slice(0, 2), 16);
        var g = parseInt(clean.slice(2, 4), 16);
        var b = parseInt(clean.slice(4, 6), 16);
        var dim = function(c) { return Math.max(0, Math.floor(c * 0.75)).toString(16).padStart(2, '0'); };
        document.documentElement.style.setProperty('--accent-deep', '#' + dim(r) + dim(g) + dim(b));
      }
    } catch (e) { }
  })();
  </script>
  <style>
    :root {
      --bg: #0c0e13;
      --panel: #161922;
      --panel-soft: #11141c;
      --border: #232735;
      --fg: #e6e9ef;
      --muted: #8a92a6;
      --accent: #f9a825;
      --accent-deep: #c77800;
      --error: #ff6b6b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --base-size: 16px;
    }
    :root[data-theme="light"] {
      --bg: #f4f5f8; --panel: #ffffff; --panel-soft: #f8f9fb;
      --border: #d8dde5; --fg: #1a1d24; --muted: #5a6478;
      --accent-deep: #b06600; --error: #c63030;
    }
    :root[data-theme="contrast"] {
      --bg: #000; --panel: #0a0a0a; --panel-soft: #050505;
      --border: #555; --fg: #fff; --muted: #c0c0c0;
      --accent: #ffd700; --accent-deep: #ccaa00; --error: #ff4444;
    }
    :root[data-text-size="small"]  { --base-size: 14px; }
    :root[data-text-size="large"]  { --base-size: 18px; }
    :root[data-text-size="xlarge"] { --base-size: 20px; }
    :root[data-font="serif"]    { --font-stack: Georgia, "Times New Roman", Cambria, serif; }
    :root[data-font="mono"]     { --font-stack: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    :root[data-font="dyslexic"] { --font-stack: "OpenDyslexic", "Comic Sans MS", system-ui, sans-serif; }
    html { font-size: var(--base-size); }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-stack);
      background: var(--bg); color: var(--fg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem 1.6rem 1.4rem;
      width: 100%;
      max-width: 380px;
    }
    .login-card .brand {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 1.2rem;
    }
    .login-card .brand .logo {
      width: 38px; height: 38px;
      background: var(--bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card .brand .logo svg { width: 28px; height: 28px; }
    .login-card .brand h1 {
      font-size: 1.1rem; font-weight: 600; margin: 0;
      letter-spacing: -0.01em;
    }
    .login-card .brand .accent { color: var(--accent); }
    .login-card .brand .sub {
      font-size: 0.74rem; color: var(--muted); margin: 0;
    }
    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block; font-size: 0.78rem; color: var(--muted);
      margin-bottom: 0.3rem; font-weight: 500;
    }
    .field input {
      width: 100%; padding: 0.55rem 0.75rem;
      background: var(--panel-soft); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: ui-monospace, monospace; font-size: 0.92rem;
    }
    .field input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249,168,37,0.18);
    }
    button.submit {
      width: 100%;
      padding: 0.65rem 1.2rem; border-radius: 8px; border: 0;
      background: var(--accent); color: #1a1200; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
      font-size: 0.92rem;
      margin-top: 0.2rem;
    }
    button.submit:hover { background: var(--accent-deep); color: #fff; }
    .error {
      padding: 0.55rem 0.8rem; border-radius: 8px;
      background: rgba(255,107,107,0.12);
      border: 1px solid rgba(255,107,107,0.3);
      color: #ffb1b1; font-size: 0.85rem;
      margin-bottom: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <ellipse cx="38" cy="42" rx="20" ry="14" fill="#f9a825"/>
          <circle cx="22" cy="26" r="11" fill="#f9a825"/>
          <path d="M 6 26 L 14 22 L 14 30 Z" fill="#ff6f00"/>
          <circle cx="20" cy="24" r="1.6" fill="#0c0e13"/>
        </svg>
      </div>
      <div>
        <h1>Ducky <span class="accent">Pool</span></h1>
        <p class="sub">Sign in to view the dashboard.</p>
      </div>
    </div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus required>
      </div>
      <button type="submit" class="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
